name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-kotlin:
    name: Shared Kotlin modules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
      - run: ./gradlew -p shared test --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shared-test-reports, path: android/shared/*/build/reports/tests, if-no-files-found: ignore }

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: omd, POSTGRES_PASSWORD: omd, POSTGRES_DB: omd_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omd" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Install document engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-draw-nogui \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin poppler-utils qpdf ghostscript fonts-noto-core python3-venv unzip
          python3 -m venv /opt/venv && /opt/venv/bin/pip install -q pdf2docx==0.5.13 python-docx==1.2.0
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:all
        env:
          TEST_DATABASE_URL: postgres://omd:omd@localhost:5432/omd_test
          TEST_REDIS_URL: redis://localhost:6379/15
          PYTHON_BIN: /opt/venv/bin/python

  android:
    name: Android build, unit tests, lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test and lint
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug testDebugUnitTest lintDebug --continue 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "::group::Error summary"
          grep -E "^e: |^w: .*(deprecated|unused)|What went wrong|^> |FAILED|Lint found|tests completed" build.log | grep -v "^> Task .* (UP-TO-DATE|NO-SOURCE|SKIPPED)" | head -200
          echo "::endgroup::"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/**/build/reports/lint-results-*.html
            android/**/build/reports/tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }

  android-instrumented:
    name: Android instrumented tests (emulator)
    runs-on: ubuntu-24.04
    needs: android
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: ./gradlew :processing:pdf:connectedDebugAndroidTest :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: instrumented-reports, path: android/**/build/reports/androidTests, if-no-files-found: ignore }
